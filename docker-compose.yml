name: datatrace

services:
  warehouse:
    image: postgres:16.4-alpine
    container_name: datatrace-warehouse
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${WAREHOUSE_DB:?set in .env}
      POSTGRES_USER: ${WAREHOUSE_ADMIN_USER:?set in .env}
      POSTGRES_PASSWORD: ${WAREHOUSE_ADMIN_PASSWORD:?set in .env}
      # Used only by database/setup.sh to set the per-role passwords.
      AGENT_SOURCE_PASSWORD: ${AGENT_SOURCE_PASSWORD:?set in .env}
      AGENT_PIPELINE_PASSWORD: ${AGENT_PIPELINE_PASSWORD:?set in .env}
      AGENT_METRICS_PASSWORD: ${AGENT_METRICS_PASSWORD:?set in .env}
      DBT_RUNNER_PASSWORD: ${DBT_RUNNER_PASSWORD:?set in .env}
    ports:
      # Localhost only — never exposed on the network.
      - "127.0.0.1:${WAREHOUSE_PORT:-55432}:5432"
    volumes:
      - warehouse_data:/var/lib/postgresql/data
      # Init scripts run once, on first start with an empty volume.
      - ./database/init:/docker-entrypoint-initdb.d:ro
      - ./database:/database:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  warehouse_data:
