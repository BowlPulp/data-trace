version: 2

models:
  - name: stg_orders
    description: Orders, typed, with IST order date.
    columns:
      - name: order_id
        data_tests: [unique, not_null]
  - name: stg_payments
    description: Successful payments, deduplicated to one row per payment_id.
    columns:
      - name: payment_id
        data_tests: [unique, not_null]
      - name: order_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id
  - name: stg_refunds
    description: Processed refunds.
    columns:
      - name: refund_id
        data_tests: [unique, not_null]
  - name: int_transactions
    description: Revenue ledger of payments (+) and refunds (-).
    columns:
      - name: txn_id
        data_tests: [not_null]
      - name: txn_type
        data_tests:
          - accepted_values:
              arguments:
                values: ["payment", "refund"]
  - name: fct_revenue
    description: Daily gross, refunds and net revenue by payment method (IST).
  - name: monthly_revenue
    description: Monthly revenue; feeds the finance revenue dashboard. built_at records when the table was last rebuilt.
    columns:
      - name: revenue_month
        data_tests: [unique, not_null]
