# Project-local profile: run dbt from this directory (dbt looks here first).
# Credentials come from the environment (.env), never from this file.
datatrace:
  target: dev
  outputs:
    dev:
      type: postgres
      host: 127.0.0.1
      port: "{{ env_var('WAREHOUSE_PORT', '55432') | int }}"
      dbname: "{{ env_var('WAREHOUSE_DB', 'datatrace') }}"
      user: dbt_runner
      password: "{{ env_var('DBT_RUNNER_PASSWORD') }}"
      schema: analytics
      threads: 4
    sandbox:
      # Remediation only: a throwaway copy of the warehouse. This login cannot connect to production.
      type: postgres
      host: 127.0.0.1
      port: "{{ env_var('WAREHOUSE_PORT', '55432') | int }}"
      dbname: datatrace_sandbox
      user: remediation_runner
      password: "{{ env_var('REMEDIATION_RUNNER_PASSWORD', '') }}"
      schema: analytics
      threads: 4
